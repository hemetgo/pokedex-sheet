<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0c1124">
    <meta name="description" content="Acompanhe sua coleção de cartas Pokémon e o progresso da Pokédex.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icon.svg?v=2" type="image/svg+xml" sizes="any">
    <link rel="shortcut icon" href="icon.svg?v=2" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.svg?v=2">
    <title>Pokédex | Coleção</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

        :root {
            --ink: #f5f7ff;
            --muted: #969fba;
            --panel: #171d35;
            --line: #2c3657;
            --accent: #6688ff;
            --accent-soft: #9e8cff;
            --indigo: #766cf1;
            --cyan: #70d9d2;
            --gold: #ffcb05;
            --bg: #0c1124;
        }

        * {
            box-sizing: border-box;
        }

        html {
            overflow-y: scroll;
            scrollbar-gutter: stable;
        }

        body {
            margin: 0;
            color: var(--ink);
            font: 15px 'DM Sans', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 5% 0%, rgba(102, 136, 255, .16), transparent 28%), radial-gradient(circle at 95% 10%, rgba(118, 108, 241, .13), transparent 25%), linear-gradient(rgba(120, 139, 210, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(120, 139, 210, .035) 1px, transparent 1px);
            background-size: auto, auto, 48px 48px, 48px 48px;
            background-attachment: scroll;
            background-repeat: no-repeat, no-repeat, repeat, repeat;
            min-height: 100vh;
        }

        .shell {
            width: min(1440px, calc(100% - 36px));
            margin: 0 auto;
            padding: 28px 0 110px;
        }

        .topbar {
            align-items: center;
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 18px;
            text-align: center;
        }

        .art-select {
            background: #10172d;
            border: 1px solid var(--line);
            border-radius: 9px;
            color: var(--ink);
            color-scheme: dark;
            cursor: pointer;
            font-size: 13px;
            min-height: 38px;
            padding: 8px 12px;
            width: 100%;
        }

        header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 28px;
            position: relative;
        }

        h1 {
            background: linear-gradient(105deg, #fff 15%, #ff9ab0 52%, #9fa8ff 90%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font: 700 clamp(2.2rem, 4vw, 3.8rem) 'Space Grotesk', sans-serif;
            letter-spacing: -.06em;
            line-height: 1;
            margin: 10px 0 10px;
        }

        .sync-button {
            align-items: center;
            background: rgba(102, 136, 255, .12);
            border: 1px solid rgba(112, 217, 210, .35);
            border-radius: 9px;
            color: var(--cyan);
            cursor: pointer;
            display: flex;
            flex-shrink: 0;
            font: 600 13px 'DM Sans', sans-serif;
            gap: 8px;
            justify-content: center;
            margin: 0 auto;
            min-height: 40px;
            padding: 9px 15px;
            width: 100%;
            transition: background .2s, border-color .2s, transform .2s;
        }

        .sync-button:hover {
            background: rgba(102, 136, 255, .25);
            border-color: var(--cyan);
            transform: translateY(-2px);
        }

        .sync-button svg {
            height: 16px;
            width: 16px;
        }

        .sync-button:disabled {
            cursor: wait;
            opacity: .65;
            transform: none;
        }

        .section-nav {
            background: rgba(18, 24, 47, .96);
            border: 1px solid var(--line);
            border-radius: 18px;
            bottom: 12px;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, .2);
            display: grid;
            gap: 8px;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            left: 50%;
            max-width: 520px;
            padding: 8px;
            position: fixed;
            transform: translateX(-50%);
            width: calc(100% - 24px);
            z-index: 40;
        }

        .nav-tab {
            align-items: center;
            background: transparent;
            border: 0;
            border-radius: 12px;
            color: var(--muted);
            cursor: pointer;
            display: flex;
            font-size: 0;
            justify-content: center;
            min-height: 42px;
            padding: 8px;
            transition: all .2s ease;
        }

        .nav-tab svg {
            display: block;
            width: 22px;
            height: 22px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .nav-tab.active {
            background: linear-gradient(135deg, rgba(102, 136, 255, .18), rgba(112, 217, 210, .12));
            border: 1px solid rgba(112, 217, 210, .24);
            color: var(--ink);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08);
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .stats {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            margin: 0 auto 26px;
            max-width: 900px;
        }

        .stat {
            background: linear-gradient(145deg, rgba(25, 33, 61, .96), rgba(18, 24, 47, .96));
            border: 1px solid var(--line);
            border-radius: 14px;
            overflow: hidden;
            padding: 17px 18px;
            position: relative;
        }

        .stat::after {
            background: linear-gradient(90deg, var(--accent), var(--indigo));
            content: '';
            height: 2px;
            left: 0;
            opacity: .8;
            position: absolute;
            right: 0;
            top: 0;
        }

        .stat-label {
            color: var(--muted);
            font-size: 12px;
        }

        .stat-value {
            display: block;
            font: 700 25px 'Space Grotesk';
            margin-top: 7px;
        }

        .progress {
            background: #2a3850;
            border-radius: 99px;
            height: 5px;
            margin-top: 12px;
            overflow: hidden;
        }

        .progress span {
            background: linear-gradient(90deg, var(--accent), var(--accent-soft));
            border-radius: inherit;
            display: block;
            height: 100%;
            transition: width .5s ease;
        }

        .toolbar {
            align-items: center;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 24px;
            padding: 12px;
        }

        .dashboard-grid {
            display: grid;
            gap: 18px;
            grid-template-columns: 1fr;
            max-width: 900px;
            margin: 18px auto 0;
        }

        .panel {
            background: linear-gradient(145deg, rgba(25, 33, 61, .96), rgba(18, 24, 47, .96));
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 18px 18px 16px;
        }

        .config-panel {
            display: grid;
            gap: 18px;
            max-width: 420px;
            margin: 18px auto 0;
            width: min(100%, 420px);
        }

        .config-row {
            display: grid;
            gap: 8px;
        }

        .config-row label {
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        .panel h3 {
            font: 700 16px 'Space Grotesk';
            letter-spacing: -.03em;
            margin: 0 0 14px;
            text-align: center;
        }

        .region-list {
            display: grid;
            gap: 18px 26px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            margin-top: 8px;
        }

        .region-line {
            align-items: center;
            display: grid;
            gap: 8px;
            grid-template-columns: 1fr auto;
        }

        .region-line span {
            color: var(--muted);
            font-size: 13px;
        }

        .bar {
            background: rgba(255, 255, 255, .04);
            border-radius: 999px;
            display: block;
            height: 8px;
            overflow: hidden;
        }

        .bar>i {
            background: linear-gradient(90deg, var(--accent), var(--cyan));
            border-radius: inherit;
            display: block;
            height: 100%;
        }

        .search {
            flex: 1 1 220px;
            position: relative;
        }

        .search svg {
            left: 12px;
            position: absolute;
            top: 11px;
        }

        input,
        select {
            background: #10172d;
            border: 1px solid var(--line);
            border-radius: 9px;
            color: var(--ink);
            font: inherit;
            min-height: 38px;
            outline: none;
            padding: 8px 12px;
        }

        input:focus,
        select:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px rgba(98, 215, 208, .12);
        }

        .search input {
            padding-left: 38px;
            width: 100%;
        }

        .result-count {
            color: var(--muted);
            font-size: 12px;
            margin-left: auto;
            padding: 0 5px;
        }

        /* --- GRID E CARDS --- */
        .grid {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            contain: layout;
        }

        .load-more {
            background: rgba(102, 136, 255, .12);
            border: 1px solid var(--line);
            border-radius: 9px;
            color: var(--ink);
            cursor: pointer;
            display: block;
            grid-column: 1 / -1;
            font: 600 13px 'DM Sans', sans-serif;
            margin: 22px auto 0;
            min-height: 40px;
            padding: 9px 18px;
        }

        .load-more:hover {
            border-color: var(--cyan);
        }

        .card {
            background: linear-gradient(145deg, #1b2544, #141c35);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 0;
            overflow: hidden;
            padding: 10px;
            position: relative;
            aspect-ratio: 2.5 / 3.5;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07), 0 10px 25px rgba(0, 0, 0, .22);
            transition: transform .28s cubic-bezier(.22, .8, .3, 1), box-shadow .28s ease;
            contain: layout paint;
            content-visibility: auto;
            contain-intrinsic-size: 210px 294px;
            user-select: none;
        }

        .card:hover {
            transform: translateY(-5px) scale(1.018);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .15), 0 18px 34px rgba(0, 0, 0, .42), 0 0 24px rgba(102, 136, 255, .24);
        }

        .card.caught {
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .1), 0 10px 25px rgba(0, 0, 0, .22), 0 0 16px rgba(112, 217, 210, .12);
        }

        .card.caught:hover {
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .16), 0 18px 34px rgba(0, 0, 0, .42), 0 0 28px rgba(112, 217, 210, .28);
        }

        .card:active {
            transform: translateY(-2px) scale(.995);
            transition-duration: .12s;
        }

        .card.has-card {
            padding: 0;
            border: none;
            background: transparent;
            border-radius: 4.5%;
        }

        .card.has-card .card-visual {
            height: 100%;
            width: 100%;
            margin: 0;
            border-radius: inherit;
        }

        .card.caught.has-card {
            box-shadow: 0 10px 25px rgba(0, 0, 0, .28), 0 0 16px rgba(112, 217, 210, .14);
        }

        .foil-corner {
            align-items: center;
            background: rgba(104, 75, 18, .82);
            border: 1px solid rgba(255, 203, 5, .48);
            border-radius: 6px;
            box-shadow: 0 2px 7px rgba(0, 0, 0, .22);
            color: #ffd96a;
            display: flex;
            font-size: 8px;
            font-weight: 700;
            gap: 3px;
            height: 19px;
            justify-content: center;
            letter-spacing: .06em;
            line-height: 1;
            padding: 0 6px;
            pointer-events: none;
            position: absolute;
            right: 7px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, .45);
            bottom: 7px;
            z-index: 5;
        }

        .card.has-card .foil-corner {
            right: 7px;
            bottom: 7px;
        }

        .card.has-card img.tcg-img {
            border-radius: inherit;
            box-shadow: 0 8px 20px rgba(0, 0, 0, .4);
            height: 100%;
            width: 100%;
            object-fit: cover;
            display: block;
        }

        .card.not-caught {
            background: linear-gradient(145deg, rgba(22, 30, 58, .75), rgba(15, 22, 44, .9));
            filter: saturate(.45);
            opacity: .72;
        }

        .card.not-caught:hover {
            opacity: .86;
        }

        .card-top {
            align-items: center;
            display: flex;
            justify-content: space-between;
            min-height: 20px;
            z-index: 2;
        }

        .number {
            color: var(--muted);
            font: 600 11px 'Space Grotesk';
        }

        .status {
            align-items: center;
            border-radius: 99px;
            display: flex;
            font-size: 9px;
            font-weight: 600;
            gap: 4px;
            padding: 2px 6px;
        }

        .status.caught {
            background: rgba(98, 215, 208, .15);
            color: var(--cyan);
        }

        .status.foil-badge {
            background: linear-gradient(135deg, rgba(255, 203, 5, .25), rgba(255, 154, 176, .2));
            border: 1px solid rgba(255, 203, 5, .4);
            color: var(--gold);
            box-shadow: 0 0 10px rgba(255, 203, 5, .2);
        }

        .status.missing {
            background: rgba(255, 255, 255, .08);
            color: var(--muted);
        }

        .card-visual {
            align-items: center;
            display: flex;
            flex: 1;
            justify-content: center;
            margin: 4px 0;
            overflow: hidden;
            position: relative;
            border-radius: 8px;
        }

        .card-visual img {
            display: block;
            filter: drop-shadow(0 8px 8px rgba(0, 0, 0, .3));
            max-height: 100%;
            max-width: 100%;
            object-fit: contain;
            transition: transform .3s ease;
        }

        .card-visual img.pixel-art {
            filter: none;
            image-rendering: pixelated;
            transform: scale(1.3);
        }

        .card.not-caught .card-visual img {
            filter: grayscale(1) brightness(.34) contrast(1.15) drop-shadow(0 0 10px rgba(102, 136, 255, .24));
            opacity: .82;
        }

        .grid-foil-layer {
            display: block;
        }

        .no-global-foil .grid-foil-layer {
            display: block;
        }

        .grid-foil-canvas {
            display: none !important;
            height: 100vh;
            inset: 0;
            pointer-events: none;
            position: fixed;
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
            contain: strict;
            z-index: 20;
            width: 100vw;
        }

        .grid-foil-layer {
            position: absolute;
            inset: 0;
            border-radius: inherit;
            background: radial-gradient(ellipse 70% 48% at 50% 50%, rgba(255, 255, 255, .28), transparent 58%), linear-gradient(115deg, rgba(255, 70, 170, .13), rgba(255, 218, 92, .1) 22%, rgba(72, 235, 255, .15) 43%, rgba(116, 126, 255, .13) 62%, rgba(218, 92, 255, .12) 78%, rgba(255, 80, 170, .13));
            background-size: 100% 100%, 270% 100%;
            mix-blend-mode: normal;
            opacity: .58;
            pointer-events: none;
            z-index: 3;
            animation: foilShimmer 2.8s ease-in-out infinite alternate;
        }

        /* Foil do grid: camada própria do card, sem depender do canvas global. */
        .grid-foil-layer {
            display: none !important;
        }

        .card.foil::before {
            background: linear-gradient(135deg, rgba(255, 83, 198, .46), rgba(255, 83, 198, .12) 24%, rgba(73, 183, 255, .48) 48%, rgba(137, 93, 255, .42) 72%, rgba(255, 93, 201, .44)), linear-gradient(108deg, transparent 31%, rgba(255, 89, 211, .65) 44%, rgba(73, 224, 255, .65) 54%, transparent 68%);
            background-size: 180% 180%, 260% 100%;
            border-radius: inherit;
            content: '';
            inset: 0;
            mix-blend-mode: normal;
            opacity: .38;
            pointer-events: none;
            position: absolute;
            z-index: 3;
            animation: gridCardFoil var(--foil-duration, 2.8s) ease-in-out infinite alternate;
            animation-delay: var(--foil-delay, 0s);
        }

        @keyframes gridCardFoil {
            from {
                background-position: 0 0, -35% 50%;
            }

            to {
                background-position: 100% 100%, 135% 50%;
            }
        }

        @media (hover: hover) and (pointer: fine) {
            .card:hover {
                animation: none;
            }
        }

        @keyframes cardHoverShake {
            0% {
                transform: translate3d(0, 0, 0) rotate(0deg);
            }

            28% {
                transform: translate3d(-1px, 0, 0) rotate(-.35deg);
            }

            56% {
                transform: translate3d(1px, -1px, 0) rotate(.3deg);
            }

            78% {
                transform: translate3d(-.5px, 0, 0) rotate(-.12deg);
            }

            100% {
                transform: translate3d(0, 0, 0) rotate(0deg);
            }
        }

        .card.foil.is-visible .grid-foil-layer {
            opacity: .62;
        }

        @media (prefers-reduced-motion: reduce) {
            .grid-foil-layer {
                animation: none;
                background-position: 0 0, 0 50%;
            }

        }

        @keyframes foilShimmer {
            0% {
                background-position: 0 0, -35% 50%;
            }

            100% {
                background-position: 0 0, 135% 50%;
            }
        }

        .name {
            font: 600 13px 'Space Grotesk';
            overflow: hidden;
            text-align: center;
            text-overflow: ellipsis;
            text-transform: capitalize;
            white-space: nowrap;
            z-index: 2;
        }

        .collection-heading {
            align-items: flex-end;
            display: flex;
            justify-content: space-between;
            margin: 18px 0 14px;
        }

        .empty {
            color: var(--muted);
            grid-column: 1 / -1;
            padding: 60px 20px;
            text-align: center;
        }

        .notice {
            color: var(--muted);
            font-size: 12px;
            margin: 18px auto 0;
            text-align: center;
            width: min(100%, 420px);
        }

        .notice strong {
            color: var(--cyan);
        }

        /* --- MODAL POKÉMON POCKET (OTIMIZADA MOBILE) --- */
        .modal-overlay {
            align-items: center;
            background: rgba(6, 9, 20, .92);
            display: flex;
            inset: 0;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            position: fixed;
            transition: opacity .25s ease;
            z-index: 100;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-close-global {
            background: rgba(255, 255, 255, .1);
            border: 1px solid rgba(255, 255, 255, .2);
            border-radius: 50%;
            color: var(--ink);
            cursor: pointer;
            height: 48px;
            width: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: absolute;
            right: 20px;
            top: 20px;
            z-index: 110;
        }

        .modal-content {
            align-items: center;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 92vw;
            position: relative;
        }

        .modal-card-3d {
            border-radius: 16px;
            box-shadow: 0 20px 38px rgba(0, 0, 0, .55), 0 0 24px rgba(102, 136, 255, .2);
            height: min(450px, 62vh);
            aspect-ratio: 2.5 / 3.5;
            position: relative;
            transform-style: preserve-3d;
            will-change: transform;
            background: #141c35;
            overflow: hidden;
            touch-action: none;
            transition: none;
            --modal-foil-x: 50%;
            --modal-foil-y: 50%;
            --modal-sheen-x: 50%;
            --modal-sheen-opacity: .62;
        }

        .modal-card-3d.has-tcg {
            border-radius: 4.5%;
        }

        .modal-card-img {
            border-radius: inherit;
            height: 100%;
            object-fit: cover;
            width: 100%;
            pointer-events: none;
        }

        .modal-card-sprite {
            align-items: center;
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: center;
            padding: 20px;
            background: radial-gradient(circle at center, #232e54 0%, #10172d 100%);
        }

        .modal-card-sprite img {
            max-height: 92%;
            max-width: 96%;
            object-fit: contain;
            filter: drop-shadow(0 15px 15px rgba(0, 0, 0, .5));
            transform: none;
        }

        .modal-card-sprite img.pixel-art {
            image-rendering: pixelated;
            transform: none;
        }

        .modal-card-sprite.silhouetted img {
            filter: brightness(0.55) contrast(1.1) drop-shadow(0 0 12px rgba(102, 136, 255, 0.4));
            opacity: 0.95;
        }

        .modal-foil-layer {
            inset: 0;
            position: absolute;
            pointer-events: none;
            border-radius: inherit;
            mix-blend-mode: screen;
            opacity: 0;
            background: linear-gradient(135deg, rgba(255, 83, 198, .52), rgba(255, 83, 198, .14) 25%, rgba(73, 183, 255, .56) 49%, rgba(137, 93, 255, .5) 73%, rgba(255, 93, 201, .5)), radial-gradient(ellipse 68% 46% at var(--modal-foil-x) var(--modal-foil-y), rgba(71, 224, 255, .48), transparent 68%);
            background-size: 180% 180%, 100% 100%;
            filter: saturate(1.35);
            overflow: hidden;
            transition: opacity .2s ease;
        }

        .modal-foil-layer::after {
            background: linear-gradient(90deg, transparent, rgba(255, 68, 190, .7) 24%, rgba(139, 93, 255, .72) 45%, rgba(55, 226, 255, .72) 60%, transparent 84%);
            border-radius: 50%;
            content: '';
            bottom: -30%;
            left: calc(var(--modal-sheen-x) - 32.5%);
            top: -30%;
            filter: blur(5px);
            opacity: var(--modal-sheen-opacity);
            position: absolute;
            transform: skewX(-18deg);
            transition: left .12s ease-out, opacity .12s ease-out;
            width: 65%;
        }

        .modal-card-3d.is-foil .modal-foil-layer {
            opacity: .62;
        }

        @media (hover: none) {
            .card.foil::before {
                animation: none;
                background: linear-gradient(135deg, rgba(255, 83, 198, .3), rgba(255, 83, 198, .07) 28%, rgba(73, 183, 255, .36) 52%, rgba(137, 93, 255, .28) 74%, rgba(255, 93, 201, .3)), linear-gradient(108deg, transparent 34%, rgba(255, 89, 211, .34) 46%, rgba(73, 224, 255, .42) 55%, transparent 68%);
                background-size: 100% 100%, 100% 100%;
                background-position: 50% 50%, 50% 50%;
                opacity: .48;
            }

            body.modal-open .card.foil::before {
                animation: none !important;
                opacity: 0 !important;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .card:hover {
                animation: none;
            }

            .modal-card-3d.is-foil .modal-foil-layer {
                animation: none;
            }
        }

        .modal-details {
            text-align: center;
        }

        .modal-title {
            font: 700 22px 'Space Grotesk';
            margin: 0;
            letter-spacing: .02em;
        }

        .modal-sub {
            color: var(--muted);
            font-size: 13px;
            margin-top: 4px;
        }

        @media (max-width: 680px) {
            .shell {
                width: min(100% - 20px, 520px);
            }

            header {
                align-items: flex-start;
                flex-direction: column;
                gap: 18px;
            }

            .section-nav {
                width: calc(100% - 16px);
            }

            .stats {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .region-list {
                grid-template-columns: 1fr;
            }

            .toolbar {
                align-items: stretch;
                display: grid;
                gap: 8px;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                padding: 10px;
            }

            .toolbar .search {
                grid-column: 1 / -1;
                width: 100%;
            }

            .toolbar select {
                min-width: 0;
                width: 100%;
            }

            .collection-heading {
                margin: 14px 0 10px;
            }

            .grid {
                gap: 10px;
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            body {
                background-attachment: scroll;
            }

            .card-visual img {
                filter: none;
                transition: none;
            }

            .card.not-caught .card-visual img {
                filter: grayscale(1) brightness(.34) contrast(1.15);
            }

            .modal-card-3d {
                height: 50vh;
                box-shadow: 0 14px 28px rgba(0, 0, 0, .5), 0 0 18px rgba(102, 136, 255, .16);
            }

            .modal-card-sprite img {
                filter: drop-shadow(0 8px 8px rgba(0, 0, 0, .42));
            }
        }
    </style>
</head>

<body>

    <!-- Modal Pocket View -->

    <div class="modal-overlay" id="cardModal" onclick="closeModal(event)">

    <nav class="section-nav" aria-label="Navegação principal">

            aria-label="Configurações">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="3.2" />
                <path
                    d="M19.4 15a1.7 1.7 0 0 0 .34 1.86l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15.5 20a1.7 1.7 0 0 0-1 .45 1.7 1.7 0 0 0-.37 1.13V22a2 2 0 1 1-4 0v-.08A1.7 1.7 0 0 0 9.5 20a1.7 1.7 0 0 0-1-.45 1.7 1.7 0 0 0-1.13.37l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4 15.5a1.7 1.7 0 0 0-.45-1 1.7 1.7 0 0 0-1.13-.37H2a2 2 0 1 1 0-4h.08A1.7 1.7 0 0 0 4 9.5a1.7 1.7 0 0 0 .45-1 1.7 1.7 0 0 0-.37-1.13l-.06-.06A2 2 0 1 1 6.85 4.48l.06.06A1.7 1.7 0 0 0 8.5 4a1.7 1.7 0 0 0 1-.45 1.7 1.7 0 0 0 .37-1.13V2a2 2 0 1 1 4 0v.08A1.7 1.7 0 0 0 14.5 4a1.7 1.7 0 0 0 1 .45 1.7 1.7 0 0 0 1.13-.37l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 20 8.5a1.7 1.7 0 0 0 .45 1 1.7 1.7 0 0 0 1.13-.37H22a2 2 0 1 1 0 4h-.08A1.7 1.7 0 0 0 20 14.5a1.7 1.7 0 0 0-.45 1Z" />
            </svg>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/1kpvD475Y7qJvoS8m-0yJ5nBy02t8RUlo2gKdkttuTW0/gviz/tq?tqx=out:csv';
        const API_CACHE_KEY = 'dexviewer-pokeapi-v1';
        const ART_STYLE_KEY = 'dexviewer-art-style';
        const CACHE_TTL = 7 * 24 * 60 * 60 * 1000;
        const IMAGE_CACHE_NAME = 'dex-img-cache-v1';

        let pokemonData = [];
        let apiData = {};
        let artStyle = localStorage.getItem(ART_STYLE_KEY) || 'pixel';
        let isCurrentCardCaught = false;
        const CARDS_PER_BATCH = 48;
        let visibleCardCount = CARDS_PER_BATCH;
        let foilObserver = null;

        async function cacheImage(url) {
            if (!url || !('caches' in window)) return;
            try {
                const cache = await caches.open(IMAGE_CACHE_NAME);
                const match = await cache.match(url);
                if (!match) {
                    const res = await fetch(url, { mode: 'no-cors' });
                    await cache.put(url, res);
                }
            } catch (e) { }
        }

        function formatPokemonName(name) {
            if (!name) return '';
            const hyphenatedNames = ['ho-oh', 'porygon-z', 'jangmo-o', 'hakamo-o', 'kommo-o', 'chi-yu', 'wo-chien', 'chien-pao', 'ting-lu', 'tapu-koko', 'tapu-lele', 'tapu-bulu', 'tapu-fini', 'great-tusk', 'scream-tail', 'brute-bonnet', 'flutter-mane', 'slither-wing', 'sandy-shocks', 'iron-treads', 'iron-bundle', 'iron-hands', 'iron-jugulis', 'iron-moth', 'iron-thorns', 'iron-leaves', 'iron-boulder', 'iron-crown', 'raging-bolt', 'gouging-fire', 'walking-wake', 'iron-valiant'];
            const lower = name.toLowerCase().trim();
            if (hyphenatedNames.includes(lower)) {
                return name.charAt(0).toUpperCase() + name.slice(1);
            }
            const baseName = lower.split('-')[0];
            return baseName.charAt(0).toUpperCase() + baseName.slice(1);
        }

        function parseCSVLine(line) {
            const result = []; let current = ''; let inQuotes = false;
            for (const char of line) {
                if (char === '"') inQuotes = !inQuotes;
                else if (char === ',' && !inQuotes) { result.push(current.trim().replace(/^"|"$/g, '')); current = ''; }
                else current += char;
            }
            result.push(current.trim().replace(/^"|"$/g, '')); return result;
        }

        function readCache(key) { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch { return null; } }
        function writeCache(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { } }

        function findColumn(headers, names) {
            return headers.findIndex(h => {
                const raw = h.trim().toLowerCase();
                const norm = raw.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '');
                return names.includes(raw) || names.includes(norm);
            });
        }

        function parseBoolean(value) {
            return ['true', 'sim', 'yes', '1', 'x', 'foil', 'holo', 'brilhante'].includes(String(value || '').trim().toLowerCase());
        }

        function parseSheet(data) {
            const rows = data.split(/\r?\n/).filter(r => r.trim());
            if (rows.length < 2) return [];

            const headers = parseCSVLine(rows[0]);

            let idCol = findColumn(headers, ['#', 'id', 'numero', 'number', 'n', 'code', 'num']);
            let caughtCol = findColumn(headers, ['pego', 'capturado', 'caught', 'status']);
            let nameCol = findColumn(headers, ['pokemon', 'nome', 'name']);
            let regionCol = findColumn(headers, ['regiao', 'region']);
            let foilCol = findColumn(headers, ['foil', 'brilhante', 'holo']);
            let cardCol = findColumn(headers, ['card', 'carta', 'imagemcarta', 'cardurl', 'image', 'link', 'url']);

            if (idCol < 0) idCol = 0;
            if (caughtCol < 0) caughtCol = 1;
            if (nameCol < 0) nameCol = 2;
            if (regionCol < 0) regionCol = 3;

            return rows.slice(1).map((row, index) => {
                const cols = parseCSVLine(row);
                if (cols.length < 2) return null;

                const rawId = cols[idCol] ? cols[idCol].replace(/\D/g, '') : '';
                const id = rawId ? parseInt(rawId, 10) : (index + 1);
                const name = cols[nameCol] || `Pokémon #${id}`;
                if (!id || !name) return null;

                return {
                    id,
                    caught: parseBoolean(cols[caughtCol]),
                    name,
                    region: (regionCol >= 0 && cols[regionCol]) ? cols[regionCol] : 'Sem região',
                    foil: parseBoolean(cols[foilCol]),
                    cardUrl: (cardCol >= 0 && cols[cardCol]) ? cols[cardCol].trim() : ''
                };
            }).filter(Boolean);
        }

        async function loadPokedex() {
            try {
                const response = await fetch(CSV_URL, { cache: 'no-store' });
                if (!response.ok) throw new Error('Servidor da planilha respondeu com erro.');

                const csvText = await response.text();
                pokemonData = parseSheet(csvText);

                render();
                setCacheNotice(Date.now(), 'Planilha sincronizada com sucesso');
            } catch (error) {
                console.error("Erro ao carregar a Pokédex:", error);
                document.getElementById('cacheNotice').innerHTML = `<strong style="color:#ff9ab0;">Erro:</strong> ${error.message}`;
            }

            const apiCache = readCache(API_CACHE_KEY);
            if (apiCache?.data) apiData = apiCache.data;
            if (!apiCache?.savedAt || Date.now() - apiCache.savedAt > CACHE_TTL) syncPokeApi();
        }

        function setCacheNotice(timestamp, label) {
            document.getElementById('cacheNotice').innerHTML = `<strong>${label}</strong> · ${timestamp ? `atualizado em ${new Date(timestamp).toLocaleDateString('pt-BR')}` : 'pronto para sincronizar'}`;
        }

        function populateRegions() {
            const select = document.getElementById('regionFilter');
            const current = select.value;
            const releaseOrder = ['kanto', 'johto', 'hoenn', 'sinnoh', 'unova', 'kalos', 'alola', 'galar', 'hisui', 'paldea'];
            const normalizeRegion = region => region.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
            const regions = [...new Set(pokemonData.map(p => p.region))].filter(Boolean);

            regions.sort((first, second) => {
                const firstIndex = releaseOrder.indexOf(normalizeRegion(first));
                const secondIndex = releaseOrder.indexOf(normalizeRegion(second));
                if (firstIndex < 0 && secondIndex < 0) return first.localeCompare(second, 'pt-BR');
                if (firstIndex < 0) return 1;
                if (secondIndex < 0) return -1;
                return firstIndex - secondIndex;
            });

            select.innerHTML = '<option value="ALL">Todas as regiões</option>';
            regions.forEach(r => {
                select.add(new Option(r, r));
            });
            select.value = [...select.options].some(o => o.value === current) ? current : 'ALL';
        }

        function setScreen(screenName) {
            document.querySelectorAll('.screen').forEach(s => {
                const isActive = s.id === `${screenName}Screen`;
                s.classList.toggle('active', isActive);
                s.hidden = !isActive;
            });
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.toggle('active', t.dataset.screen === screenName));
        }

        function render() { populateRegions(); updateStats(); filterGrid(); }

        function getPokemonImage(extra, style, id) {
            const official = extra?.sprites?.official || `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;
            const url = style === 'pixel' ? (extra?.sprites?.pixel || `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`) : (extra?.sprites?.[style] || official);
            return url;
        }

        function changeArtStyle() {
            artStyle = document.getElementById('artStyle').value;
            localStorage.setItem(ART_STYLE_KEY, artStyle);
            filterGrid();
        }

        function filterGrid() {
            const search = document.getElementById('search').value.toLowerCase().trim();
            const region = document.getElementById('regionFilter').value;
            const status = document.getElementById('statusFilter').value;

            const filtered = pokemonData.filter(p =>
                (!search || p.name.toLowerCase().includes(search) || String(p.id).includes(search)) &&
                (region === 'ALL' || p.region === region) &&
                (status === 'ALL' || (status === 'CAUGHT' ? p.caught : !p.caught))
            );
            visibleCardCount = CARDS_PER_BATCH;
            renderGrid(filtered);
            document.getElementById('resultCount').textContent = `${filtered.length} de ${pokemonData.length} Pokémon`;
        }

        const gridFoilCanvas = document.getElementById('gridFoilCanvas');
        const gridFoilContext = gridFoilCanvas?.getContext('2d');
        let gridFoilFrame = 0;

        function drawGridFoilCanvas() {
            gridFoilFrame = 0;
            if (!gridFoilCanvas || !gridFoilContext || getComputedStyle(gridFoilCanvas).display === 'none') return;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const width = window.innerWidth;
            const height = window.innerHeight;
            if (gridFoilCanvas.width !== width * dpr || gridFoilCanvas.height !== height * dpr) {
                gridFoilCanvas.width = width * dpr;
                gridFoilCanvas.height = height * dpr;
                gridFoilCanvas.style.width = `${width}px`;
                gridFoilCanvas.style.height = `${height}px`;
            }

            gridFoilContext.setTransform(dpr, 0, 0, dpr, 0, 0);
            gridFoilContext.clearRect(0, 0, width, height);
            document.querySelectorAll('#pokedexGrid .card.foil').forEach(card => {
                const rect = card.getBoundingClientRect();
                if (rect.bottom <= 0 || rect.top >= height) return;
                const radius = Math.min(14, rect.width / 2, rect.height / 2);
                const phase = (window.scrollY * .14) % (rect.width * 1.8) - rect.width * .9;
                const gradient = gridFoilContext.createLinearGradient(
                    rect.left - rect.width * .9 + phase,
                    rect.top,
                    rect.right + rect.width * .9 + phase,
                    rect.bottom
                );
                gradient.addColorStop(0, 'rgba(255, 70, 170, .12)');
                gradient.addColorStop(.18, 'rgba(255, 218, 92, .1)');
                gradient.addColorStop(.36, 'rgba(72, 235, 255, .14)');
                gradient.addColorStop(.5, 'rgba(255, 255, 255, .42)');
                gradient.addColorStop(.62, 'rgba(116, 126, 255, .13)');
                gradient.addColorStop(.8, 'rgba(218, 92, 255, .11)');
                gradient.addColorStop(1, 'rgba(255, 80, 170, .12)');
                gridFoilContext.save();
                gridFoilContext.beginPath();
                if (typeof gridFoilContext.roundRect === 'function') {
                    gridFoilContext.roundRect(rect.left, rect.top, rect.width, rect.height, radius);
                } else {
                    const x = rect.left;
                    const y = rect.top;
                    const right = rect.right;
                    const bottom = rect.bottom;
                    gridFoilContext.moveTo(x + radius, y);
                    gridFoilContext.lineTo(right - radius, y);
                    gridFoilContext.quadraticCurveTo(right, y, right, y + radius);
                    gridFoilContext.lineTo(right, bottom - radius);
                    gridFoilContext.quadraticCurveTo(right, bottom, right - radius, bottom);
                    gridFoilContext.lineTo(x + radius, bottom);
                    gridFoilContext.quadraticCurveTo(x, bottom, x, bottom - radius);
                    gridFoilContext.lineTo(x, y + radius);
                    gridFoilContext.quadraticCurveTo(x, y, x + radius, y);
                    gridFoilContext.closePath();
                }
                gridFoilContext.clip();
                gridFoilContext.fillStyle = gradient;
                gridFoilContext.fillRect(0, 0, width, height);
                gridFoilContext.restore();
            });
        }

        function queueGridFoilDraw() {
            if (!gridFoilFrame) gridFoilFrame = requestAnimationFrame(drawGridFoilCanvas);
        }

        window.addEventListener('scroll', queueGridFoilDraw, { passive: true });
        window.addEventListener('resize', queueGridFoilDraw, { passive: true });

        function observeVisibleFoils() {
            if (foilObserver) foilObserver.disconnect();

            const foilCards = document.querySelectorAll('#pokedexGrid .card.foil');
            if (!('IntersectionObserver' in window)) {
                foilCards.forEach(card => card.classList.add('is-visible'));
                queueGridFoilDraw();
                return;
            }

            foilObserver = new IntersectionObserver(entries => {
                entries.forEach(entry => {
                    entry.target.classList.toggle('is-visible', entry.isIntersecting);
                });
            }, { threshold: 0 });

            foilCards.forEach(card => foilObserver.observe(card));
            queueGridFoilDraw();
        }

        function renderGrid(list) {
            const grid = document.getElementById('pokedexGrid');
            const visibleList = list.slice(0, visibleCardCount);
            grid.innerHTML = list.length ? '' : '<div class="empty">Nenhum Pokémon encontrado com esses filtros.</div>';

            visibleList.forEach(p => {
                const extra = apiData[p.id] || {};
                const displayName = formatPokemonName(extra.name || p.name);
                const card = document.createElement('article');

                const hasCard = p.caught && p.cardUrl;
                const foilLayer = p.caught && p.foil ? '<span class="grid-foil-layer" aria-hidden="true"></span>' : '';
                const foilCorner = p.caught && p.foil ? '<span class="foil-corner" aria-label="Carta foil">★ FOIL</span>' : '';

                let cardClasses = `card ${p.caught ? 'caught' : 'not-caught'}`;
                if (p.caught && p.foil) cardClasses += ' foil';
                if (hasCard) cardClasses += ' has-card';
                card.className = cardClasses;

                if (p.caught && p.foil) {
                    const foilPhase = (p.id * 37) % 17;
                    card.style.setProperty('--foil-delay', `-${(foilPhase / 10).toFixed(2)}s`);
                    card.style.setProperty('--foil-duration', `${(2.55 + ((p.id * 13) % 9) / 10).toFixed(2)}s`);
                }

                card.onclick = () => openModal(p, displayName, extra);

                if (hasCard) {
                    card.innerHTML = `
                        <div class="card-visual">
                            <img class="tcg-img" src="${p.cardUrl}" alt="${displayName}" loading="lazy" onerror="this.onerror=null; this.src='${getPokemonImage(extra, artStyle, p.id)}';">
                            ${foilLayer}
                        </div>
                        ${foilCorner}
                    `;
                } else {
                    let visualHTML = `<div class="card-visual"><img class="${artStyle === 'pixel' ? 'pixel-art' : ''}" src="${getPokemonImage(extra, artStyle, p.id)}" alt="${displayName}" loading="lazy">${foilLayer}</div>`;

                    let statusBadge = p.caught
                        ? (p.foil ? '<span class="status foil-badge">★ Foil</span>' : '<span class="status caught">● Capturado</span>')
                        : '<span class="status missing">○ Faltante</span>';

                    card.innerHTML = `
                        <div class="card-top">
                            <span class="number">#${String(p.id).padStart(3, '0')}</span>
                            ${statusBadge}
                        </div>
                        ${visualHTML}
                        <div class="name">${displayName}</div>
                        ${foilCorner}
                    `;
                }
                grid.appendChild(card);
            });

            if (visibleList.length < list.length) {
                const loadMore = document.createElement('button');
                loadMore.className = 'load-more';
                loadMore.type = 'button';
                loadMore.textContent = `Mostrar mais (${list.length - visibleList.length})`;
                loadMore.onclick = () => {
                    visibleCardCount += CARDS_PER_BATCH;
                    renderGrid(list);
                };
                grid.appendChild(loadMore);
            }

            observeVisibleFoils();
        }

        function updateStats() {
            const total = pokemonData.length;
            const caught = pokemonData.filter(p => p.caught).length;
            const missing = total - caught;
            const percentage = total ? Math.round((caught / total) * 100) : 0;

            document.getElementById('progressStat').textContent = `${percentage}%`;
            document.getElementById('progressBar').style.width = `${percentage}%`;
            document.getElementById('caughtStat').textContent = caught;
            document.getElementById('missingStat').textContent = missing;

            const regionStatsMap = pokemonData.reduce((acc, p) => {
                const r = p.region || 'Sem região';
                if (!acc[r]) acc[r] = { total: 0, caught: 0 };
                acc[r].total += 1;
                if (p.caught) acc[r].caught += 1;
                return acc;
            }, {});

            const regionStatsContainer = document.getElementById('regionStats');
            regionStatsContainer.innerHTML = '';

            Object.entries(regionStatsMap).forEach(([region, data]) => {
                const pct = data.total ? Math.round((data.caught / data.total) * 100) : 0;
                const row = document.createElement('div');
                row.className = 'region-line';
                row.innerHTML = `
                    <span>${region} (${data.caught}/${data.total})</span>
                    <strong style="font-size: 12px;">${pct}%</strong>
                    <div class="bar" style="grid-column: 1 / -1;"><i style="width: ${pct}%;"></i></div>
                `;
                regionStatsContainer.appendChild(row);
            });
        }

        async function syncPokeApi() {
            const syncBtn = document.getElementById('syncButton');
            if (syncBtn) syncBtn.disabled = true;
            document.getElementById('cacheNotice').textContent = 'Sincronizando nomes com PokéAPI...';

            try {
                const listRes = await fetch('https://pokeapi.co/api/v2/pokemon?limit=1025');
                const listData = await listRes.json();
                const newApiData = {};

                listData.results.forEach((item, index) => {
                    const id = index + 1;
                    newApiData[id] = {
                        name: item.name,
                        sprites: {
                            pixel: `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`,
                            official: `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`,
                            home: `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/home/${id}.png`,
                            dream: `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/dream-world/${id}.svg`
                        }
                    };
                });

                apiData = newApiData;
                writeCache(API_CACHE_KEY, { savedAt: Date.now(), data: apiData });
                setCacheNotice(Date.now(), 'PokéAPI atualizada');
                render();
            } catch (e) {
                console.error(e);
                document.getElementById('cacheNotice').textContent = 'Aviso: PokéAPI indisponível, usando dados da planilha.';
            } finally {
                if (syncBtn) syncBtn.disabled = false;
            }
        }

        /* --- MODAL POKÉMON POCKET --- */
        const modal = document.getElementById('cardModal');
        const modalCard3D = document.getElementById('modalCard3D');
        const modalCardBody = document.getElementById('modalCardBody');
        const modalFoilLayer = document.getElementById('modalFoilLayer');
        const modalTitle = document.getElementById('modalTitle');
        const modalSub = document.getElementById('modalSub');
        let modalRect = null;
        let modalPoint = null;
        let modalFrame = 0;
        let modalTargetX = 0;
        let modalTargetY = 0;
        let modalCurrentX = 0;
        let modalCurrentY = 0;
        let modalVelocityX = 0;
        let modalVelocityY = 0;

        function clamp(value, min, max) {
            return Math.min(Math.max(value, min), max);
        }

        function openModal(pokemon, displayName, extra) {
            isCurrentCardCaught = pokemon.caught;
            const isFoil = pokemon.caught && pokemon.foil;

            modalCard3D.classList.toggle('is-caught', pokemon.caught);
            modalCard3D.classList.toggle('is-foil', isFoil);
            modalCard3D.classList.toggle('has-tcg', pokemon.caught && !!pokemon.cardUrl);
            modalFoilLayer.style.opacity = isFoil ? '' : '0';
            modalCard3D.style.setProperty('--modal-foil-x', '50%');
            modalCard3D.style.setProperty('--modal-foil-y', '50%');
            modalCard3D.style.setProperty('--modal-sheen-x', '50%');
            modalCard3D.style.setProperty('--modal-sheen-opacity', '.62');

            if (pokemon.caught) {
                if (pokemon.cardUrl) {
                    modalCardBody.innerHTML = `<img class="modal-card-img" src="${pokemon.cardUrl}" alt="${displayName}">`;
                } else {
                    modalCardBody.innerHTML = `
                        <div class="modal-card-sprite">
                            <img class="${artStyle === 'pixel' ? 'pixel-art' : ''}" src="${getPokemonImage(extra, artStyle, pokemon.id)}" alt="${displayName}">
                        </div>
                    `;
                }
            } else {
                modalCardBody.innerHTML = `
                    <div class="modal-card-sprite silhouetted">
                        <img class="${artStyle === 'pixel' ? 'pixel-art' : ''}" src="${getPokemonImage(extra, artStyle, pokemon.id)}" alt="${displayName}">
                    </div>
                `;
            }

            modalTitle.textContent = `#${String(pokemon.id).padStart(3, '0')} - ${displayName.toUpperCase()}`;
            modalSub.textContent = `${pokemon.region} • ${pokemon.caught ? (pokemon.foil ? 'Foil Capturado' : 'Capturado') : 'Não registrado'}`;

            modal.classList.add('active');
            document.body.classList.add('modal-open');
        }

        function closeModal(e) {
            modal.classList.remove('active');
            modalCard3D.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
            modalFoilLayer.style.opacity = '0';
            modalCard3D.style.setProperty('--modal-foil-x', '50%');
            modalCard3D.style.setProperty('--modal-foil-y', '50%');
            modalCard3D.style.setProperty('--modal-sheen-x', '50%');
            modalCard3D.style.setProperty('--modal-sheen-opacity', '.62');
            document.body.classList.remove('modal-open');
            modalRect = null;
            modalPoint = null;
            modalTargetX = 0;
            modalTargetY = 0;
            modalCurrentX = 0;
            modalCurrentY = 0;
            modalVelocityX = 0;
            modalVelocityY = 0;
            isCurrentCardCaught = false;
        }

        function updateCardTransform(rect, x, y) {
            if (!isCurrentCardCaught) return;
            const centerX = rect.width / 2;
            const centerY = rect.height / 2;

            modalTargetX = clamp((y - centerY) / centerY, -1.25, 1.25) * -10;
            modalTargetY = clamp((x - centerX) / centerX, -1.25, 1.25) * 10;
        }

        function paintModalCard() {
            modalFrame = 0;
            if (modalRect && modalPoint) updateCardTransform(modalRect, modalPoint.x - modalRect.left, modalPoint.y - modalRect.top);
            modalVelocityX += (modalTargetX - modalCurrentX) * .18;
            modalVelocityY += (modalTargetY - modalCurrentY) * .18;
            modalVelocityX *= .72;
            modalVelocityY *= .72;
            modalCurrentX += modalVelocityX;
            modalCurrentY += modalVelocityY;
            modalCard3D.style.transform = `perspective(1000px) rotateX(${modalCurrentX}deg) rotateY(${modalCurrentY}deg)`;
            modalCard3D.style.setProperty('--modal-foil-x', `${clamp(50 + modalCurrentY * 3.4, 10, 90)}%`);
            modalCard3D.style.setProperty('--modal-foil-y', `${clamp(50 - modalCurrentX * 3.4, 10, 90)}%`);
            modalCard3D.style.setProperty('--modal-sheen-x', `${clamp(50 + modalCurrentY * 4.5, 8, 92)}%`);
            modalCard3D.style.setProperty('--modal-sheen-opacity', `${clamp(.42 + (Math.abs(modalCurrentX) + Math.abs(modalCurrentY)) * .018, .42, .72)}`);
            const settled = Math.abs(modalTargetX - modalCurrentX) < .02 && Math.abs(modalTargetY - modalCurrentY) < .02 && Math.abs(modalVelocityX) < .02 && Math.abs(modalVelocityY) < .02;
            if (!settled || modalTargetX !== 0 || modalTargetY !== 0) modalFrame = requestAnimationFrame(paintModalCard);
        }

        function queueModalCardPoint(e) {
            modalPoint = { x: e.clientX, y: e.clientY };
            if (!modalFrame) modalFrame = requestAnimationFrame(paintModalCard);
        }

        modalCard3D.addEventListener('pointerdown', (e) => {
            if (!isCurrentCardCaught) return;
            modalCard3D.setPointerCapture?.(e.pointerId);
            modalRect = modalCard3D.getBoundingClientRect();
            queueModalCardPoint(e);
            if (e.pointerType === 'touch') e.preventDefault();
        });

        modal.addEventListener('pointermove', (e) => {
            if (!isCurrentCardCaught) return;
            if (e.pointerType === 'touch' && !modalCard3D.hasPointerCapture?.(e.pointerId)) return;
            if (!modalRect) modalRect = modalCard3D.getBoundingClientRect();
            queueModalCardPoint(e);
            if (e.pointerType === 'touch') e.preventDefault();
        }, { passive: false });

        function resetModalCard() {
            modalRect = null;
            modalPoint = null;
            modalTargetX = 0;
            modalTargetY = 0;
            modalVelocityX = 0;
            modalVelocityY = 0;
            if (!modalFrame) modalFrame = requestAnimationFrame(paintModalCard);
        }

        modalCard3D.addEventListener('pointerup', (e) => {
            modalCard3D.releasePointerCapture?.(e.pointerId);
            if (e.pointerType === 'touch') resetModalCard();
        });
        modalCard3D.addEventListener('pointercancel', resetModalCard);
        modal.addEventListener('pointerleave', resetModalCard);

        document.getElementById('artStyle').value = artStyle;
        loadPokedex();

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(() => { });
            });
        }
    </script>
</body>
