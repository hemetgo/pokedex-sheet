<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0c1124">
    <title>Pokédex | Coleção</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

        :root {
            --ink: #f5f7ff;
            --muted: #969fba;
            --panel: #171d35;
            --line: #2c3657;
            --accent: #6688ff;
            --accent-soft: #9e8cff;
            --indigo: #766cf1;
            --cyan: #70d9d2;
            --gold: #f3c96a;
            --bg: #0c1124;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            color: var(--ink);
            font: 15px 'DM Sans', sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at 5% 0%, rgba(102, 136, 255, .16), transparent 28%), radial-gradient(circle at 95% 10%, rgba(118, 108, 241, .13), transparent 25%), linear-gradient(rgba(120, 139, 210, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(120, 139, 210, .035) 1px, transparent 1px);
            background-size: auto, auto, 48px 48px, 48px 48px;
            min-height: 100vh;
        }

        .shell {
            width: min(1440px, calc(100% - 36px));
            margin: 0 auto;
            padding: 28px 0 48px;
        }

        .topbar {
            align-items: center;
            margin-bottom: 32px;
        }

        .sync-tools {
            align-items: center;
            display: flex;
            gap: 8px;
        }

        .art-select {
            background: #10172d;
            border-color: rgba(112, 217, 210, .25);
            color: var(--ink);
            color-scheme: dark;
            cursor: pointer;
            font-size: 12px;
            min-height: 38px;
            padding-right: 28px;
        }

        .art-select option {
            background: #10172d;
            color: var(--ink);
        }

        header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 28px;
            position: relative;
        }

        .eyebrow {
            align-items: center;
            color: var(--cyan);
            display: flex;
            font-size: 11px;
            font-weight: 700;
            gap: 9px;
            letter-spacing: .16em;
            text-transform: uppercase;
        }

        .eyebrow::before {
            background: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 14px var(--accent);
            content: '';
            height: 7px;
            width: 7px;
        }

        h1 {
            background: linear-gradient(105deg, #fff 15%, #ff9ab0 52%, #9fa8ff 90%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font: 700 clamp(2.2rem, 4vw, 3.8rem) 'Space Grotesk', sans-serif;
            letter-spacing: -.06em;
            line-height: 1;
            margin: 10px 0 10px;
        }

        .sync-button {
            align-items: center;
            background: rgba(102, 136, 255, .12);
            border: 1px solid rgba(112, 217, 210, .25);
            border-radius: 50%;
            color: var(--cyan);
            cursor: pointer;
            display: flex;
            height: 38px;
            justify-content: center;
            padding: 0;
            transition: background .2s, border-color .2s, transform .2s;
            width: 38px;
        }

        .sync-button:hover {
            background: rgba(102, 136, 255, .25);
            border-color: var(--cyan);
            transform: translateY(-2px);
        }

        .sync-button svg {
            height: 17px;
            width: 17px;
        }

        .sync-button::after {
            background: var(--ink);
            border: 1px solid var(--line);
            border-radius: 6px;
            color: var(--bg);
            content: 'Atualizar PokéAPI';
            font: 500 11px 'DM Sans';
            opacity: 0;
            padding: 5px 8px;
            pointer-events: none;
            position: absolute;
            right: 0;
            top: 46px;
            transform: translateY(-3px);
            transition: opacity .2s, transform .2s;
            white-space: nowrap;
            z-index: 3;
        }

        .sync-button:hover::after {
            opacity: 1;
            transform: translateY(0);
        }

        .sync-button:disabled {
            cursor: wait;
            opacity: .65;
            transform: none;
        }

        .stats {
            display: grid;
            gap: 12px;
            grid-template-columns: repeat(3, 1fr);
            margin-bottom: 26px;
        }

        .stat {
            background: linear-gradient(145deg, rgba(25, 33, 61, .96), rgba(18, 24, 47, .96));
            border: 1px solid var(--line);
            border-radius: 14px;
            overflow: hidden;
            padding: 17px 18px;
            position: relative;
        }

        .stat::after {
            background: linear-gradient(90deg, var(--accent), var(--indigo));
            content: '';
            height: 2px;
            left: 0;
            opacity: .8;
            position: absolute;
            right: 0;
            top: 0;
        }

        .stat-label {
            color: var(--muted);
            font-size: 12px;
        }

        .stat-value {
            display: block;
            font: 700 25px 'Space Grotesk';
            margin-top: 7px;
        }

        .progress {
            background: #2a3850;
            border-radius: 99px;
            height: 5px;
            margin-top: 12px;
            overflow: hidden;
        }

        .progress span {
            background: linear-gradient(90deg, var(--accent), var(--accent-soft));
            border-radius: inherit;
            display: block;
            height: 100%;
            transition: width .5s ease;
        }

        .toolbar {
            align-items: center;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 24px;
            padding: 12px;
        }

        .search {
            flex: 1 1 220px;
            position: relative;
        }

        .search svg {
            left: 12px;
            position: absolute;
            top: 11px;
        }

        input,
        select {
            background: #10172d;
            border: 1px solid var(--line);
            border-radius: 9px;
            color: var(--ink);
            font: inherit;
            min-height: 38px;
            outline: none;
            padding: 8px 12px;
        }

        input:focus,
        select:focus {
            border-color: var(--cyan);
            box-shadow: 0 0 0 3px rgba(98, 215, 208, .12);
        }

        .search input {
            padding-left: 38px;
            width: 100%;
        }

        .result-count {
            color: var(--muted);
            font-size: 12px;
            margin-left: auto;
            padding: 0 5px;
        }

        .grid {
            display: grid;
            gap: 14px;
            grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
        }

        .card {
            background: linear-gradient(145deg, #1b2544, #141c35);
            border: 0;
            border-radius: 13px;
            display: flex;
            flex-direction: column;
            min-width: 0;
            overflow: hidden;
            padding: 13px;
            position: relative;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07), 0 10px 25px rgba(0, 0, 0, .22);
            transition: transform .2s, box-shadow .2s;
        }

        .card:hover {
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12), 0 15px 30px rgba(0, 0, 0, .34), 0 0 20px rgba(102, 136, 255, .12);
            transform: translateY(-4px);
        }

        .card.not-caught {
            filter: grayscale(.8);
            opacity: .58;
        }

        .card.caught {
            box-shadow: inset 0 1px 0 rgba(112, 217, 210, .12), 0 10px 25px rgba(0, 0, 0, .22);
        }

        .card-top {
            align-items: center;
            display: flex;
            justify-content: space-between;
            min-height: 22px;
            padding: 0 2px;
        }

        .number {
            color: var(--muted);
            font: 600 12px 'Space Grotesk';
        }

        .status {
            align-items: center;
            border-radius: 99px;
            display: flex;
            font-size: 10px;
            gap: 4px;
            padding: 4px 7px;
        }

        .status.caught {
            background: rgba(98, 215, 208, .13);
            color: var(--cyan);
        }

        .status.missing {
            background: rgba(255, 200, 87, .1);
            color: var(--gold);
        }

        .card img {
            display: block;
            filter: drop-shadow(0 14px 10px rgba(0, 0, 0, .28));
            height: 100%;
            object-fit: contain;
            width: 100%;
        }

        .card img.pixel-art {
            filter: none;
            image-rendering: pixelated;
            transform: scale(1.28);
        }

        .card-visual {
            background: transparent;
            border-radius: 0;
            height: 158px;
            margin: 5px 0 10px;
            overflow: visible;
            position: relative;
        }

        .card-visual::after {
            display: none;
        }

        .name {
            font: 600 17px 'Space Grotesk';
            overflow: hidden;
            text-align: center;
            text-overflow: ellipsis;
            text-transform: capitalize;
            white-space: nowrap;
        }

        .collection-heading {
            align-items: end;
            display: flex;
            justify-content: space-between;
            margin: 30px 0 15px;
        }

        .section-kicker {
            color: var(--accent);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
        }

        .collection-heading h2 {
            font: 700 25px 'Space Grotesk';
            letter-spacing: -.04em;
            margin: 4px 0 0;
        }

        .empty {
            color: var(--muted);
            grid-column: 1 / -1;
            padding: 60px 20px;
            text-align: center;
        }

        .notice {
            color: var(--muted);
            font-size: 12px;
            margin-top: 18px;
            text-align: right;
        }

        .notice strong {
            color: var(--cyan);
        }

        @media (max-width: 680px) {
            .shell {
                width: min(100% - 24px, 520px);
            }

            header {
                align-items: flex-start;
                flex-direction: column;
                gap: 18px;
            }

            .sync-button {
                position: static;
            }

            .sync-tools {
                align-self: flex-end;
            }

            .stats {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            .stat {
                padding: 13px 10px;
            }

            .stat-label {
                font-size: 10px;
            }

            .stat-value {
                font-size: 20px;
            }

            .toolbar {
                align-items: stretch;
                flex-direction: column;
            }

            .search {
                flex-basis: auto;
            }

            .result-count {
                margin-left: 0;
            }

            .grid {
                gap: 10px;
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .card {
                padding: 10px;
            }

            .card-visual {
                height: 110px;
            }

            .card img {
                height: 100%;
            }

            .collection-heading {
                align-items: flex-start;
                flex-direction: column;
                gap: 6px;
            }
        }
    </style>
</head>

<body>
    <main class="shell">
        <header class="topbar">
            <div><span class="eyebrow">Minha coleção</span>
                <h1>Pokédex</h1>
            </div>
            <div class="sync-tools">
                <select class="art-select" id="artStyle" aria-label="Estilo de arte" onchange="changeArtStyle()">
                    <option value="official">Ilustração oficial</option>
                    <option value="home">Arte HOME</option>
                    <option value="dream">Dream World</option>
                    <option value="pixel">Pixel art</option>
                </select>
                <button class="sync-button" id="syncButton" type="button" onclick="syncPokeApi()"
                    aria-label="Atualizar dados da PokéAPI"><svg aria-hidden="true" fill="none" stroke="currentColor"
                        stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
                        <path d="M20 11a8.1 8.1 0 0 0-14.8-4L3 10"></path>
                        <path d="M3 4v6h6"></path>
                        <path d="M4 13a8.1 8.1 0 0 0 14.8 4L21 14"></path>
                        <path d="M21 20v-6h-6"></path>
                    </svg></button>
            </div>
        </header>
        <section class="stats" aria-label="Estatísticas">
            <div class="stat"><span class="stat-label">Progresso total</span><strong class="stat-value"
                    id="progressStat">--</strong>
                <div class="progress"><span id="progressBar" style="width:0%"></span></div>
            </div>
            <div class="stat"><span class="stat-label">Capturados</span><strong class="stat-value"
                    id="caughtStat">--</strong></div>
            <div class="stat"><span class="stat-label">Faltantes</span><strong class="stat-value"
                    id="missingStat">--</strong></div>
        </section>
        <section class="toolbar" aria-label="Filtros">
            <label class="search"><svg aria-hidden="true" fill="none" height="16" stroke="currentColor"
                    viewBox="0 0 24 24" width="16">
                    <circle cx="11" cy="11" r="7"></circle>
                    <path d="m20 20-4-4"></path>
                </svg><input id="search" type="search" placeholder="Buscar por nome ou número..."
                    oninput="filterGrid()"></label>
            <select id="regionFilter" aria-label="Filtrar por região" onchange="filterGrid()">
                <option value="ALL">Todas as regiões</option>
            </select>
            <select id="statusFilter" aria-label="Filtrar por status" onchange="filterGrid()">
                <option value="ALL">Todos</option>
                <option value="CAUGHT">Somente Capturados</option>
                <option value="NOT_CAUGHT">Somente Faltantes</option>
            </select>
        </section>
        <section class="collection-heading">
            <div><span class="section-kicker">Coleção</span>
                <h2>Todos os Pokémon</h2>
            </div><span class="result-count" id="resultCount">Carregando...</span>
        </section>
        <section class="grid" id="pokedexGrid" aria-live="polite"></section>
        <p class="notice" id="cacheNotice">Carregando coleção...</p>
    </main>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/1kpvD475Y7qJvoS8m-0yJ5nBy02t8RUlo2gKdkttuTW0/gviz/tq?tqx=out:csv&gid=1886680311';
        const API_CACHE_KEY = 'dexviewer-pokeapi-v1';
        const ART_STYLE_KEY = 'dexviewer-art-style';
        const CACHE_TTL = 7 * 24 * 60 * 60 * 1000;
        localStorage.removeItem('dexviewer-collection-v2');
        let pokemonData = [];
        let apiData = {};
        let artStyle = localStorage.getItem(ART_STYLE_KEY) || 'official';

        function parseCSVLine(line) {
            const result = []; let current = ''; let inQuotes = false;
            for (const char of line) { if (char === '"') inQuotes = !inQuotes; else if (char === ',' && !inQuotes) { result.push(current.trim().replace(/^"|"$/g, '')); current = ''; } else current += char; }
            result.push(current.trim().replace(/^"|"$/g, '')); return result;
        }
        function readCache(key) { try { return JSON.parse(localStorage.getItem(key) || 'null'); } catch { return null; } }
        function writeCache(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (error) { console.warn('Cache indisponível', error); } }
        function normalizeHeader(value) { const header = value.trim(); if (header === '#') return 'id'; return header.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
        function findColumn(headers, names) { return headers.findIndex(header => names.includes(normalizeHeader(header))); }
        function parseSheet(data) {
            const rows = data.split(/\r?\n/).filter(row => row.trim());
            if (rows.length < 2) return [];
            const headers = parseCSVLine(rows[0]);
            const idColumn = findColumn(headers, ['id', 'numero', 'number', 'n']);
            const caughtColumn = findColumn(headers, ['pego', 'capturado', 'caught', 'status']);
            const nameColumn = findColumn(headers, ['pokemon', 'nome', 'name']);
            const regionColumn = findColumn(headers, ['regiao', 'region']);
            if ([idColumn, caughtColumn, nameColumn].some(column => column < 0)) throw new Error('A planilha precisa ter colunas de número, status e Pokémon.');
            return rows.slice(1).map(row => { const cols = parseCSVLine(row); const id = parseInt((cols[idColumn] || '').replace(/\D/g, ''), 10); const name = cols[nameColumn]; if (!id || !name) return null; return { id, caught: (cols[caughtColumn] || '').toUpperCase() === 'TRUE', name, region: regionColumn >= 0 ? (cols[regionColumn] || 'Sem região') : 'Sem região' }; }).filter(Boolean);
        }

        async function loadPokedex() {
            try { const response = await fetch(CSV_URL, { cache: 'no-store' }); if (!response.ok) throw new Error('Planilha indisponível'); pokemonData = parseSheet(await response.text()); render(); setCacheNotice(Date.now(), 'Planilha sincronizada'); }
            catch (error) { if (!pokemonData.length) document.getElementById('cacheNotice').textContent = 'Não foi possível carregar a planilha. Verifique a conexão.'; }
            const apiCache = readCache(API_CACHE_KEY); if (apiCache?.data) apiData = apiCache.data;
            if (!apiCache?.savedAt || Date.now() - apiCache.savedAt > CACHE_TTL || pokemonData.some(p => !apiCache.data?.[p.id]?.name)) syncPokeApi();
        }
        function setCacheNotice(timestamp, label) { document.getElementById('cacheNotice').innerHTML = `<strong>${label}</strong> · ${timestamp ? `atualizado em ${new Date(timestamp).toLocaleDateString('pt-BR')}` : 'pronto para sincronizar'}`; }
        function populateRegions() { const select = document.getElementById('regionFilter'); const current = select.value; select.innerHTML = '<option value="ALL">Todas as regiões</option>';[...new Set(pokemonData.map(p => p.region))].filter(Boolean).sort().forEach(region => { const option = new Option(region, region); select.add(option); }); select.value = [...select.options].some(o => o.value === current) ? current : 'ALL'; }
        function render() { populateRegions(); updateStats(); filterGrid(); }
        function getPokemonImage(extra, style, id) { const official = extra?.sprites?.official || `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`; if (style === 'pixel') return extra?.sprites?.pixel || `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${id}.png`; return extra?.sprites?.[style] || official; }
        function changeArtStyle() { artStyle = document.getElementById('artStyle').value; localStorage.setItem(ART_STYLE_KEY, artStyle); filterGrid(); if (['home', 'dream'].includes(artStyle) && pokemonData.some(p => !apiData[p.id]?.sprites?.[artStyle])) syncPokeApi(); }
        function filterGrid() { const search = document.getElementById('search').value.toLowerCase().trim(); const region = document.getElementById('regionFilter').value; const status = document.getElementById('statusFilter').value; const filtered = pokemonData.filter(p => (!search || p.name.toLowerCase().includes(search) || String(p.id).includes(search)) && (region === 'ALL' || p.region === region) && (status === 'ALL' || (status === 'CAUGHT' ? p.caught : !p.caught))); renderGrid(filtered); document.getElementById('resultCount').textContent = `${filtered.length} de ${pokemonData.length} Pokémon`; }
        function renderGrid(list) { const grid = document.getElementById('pokedexGrid'); grid.innerHTML = list.length ? '' : '<div class="empty">Nenhum Pokémon encontrado com esses filtros.</div>'; list.forEach(p => { const extra = apiData[p.id] || {}; const displayName = extra.name || p.name; const card = document.createElement('article'); card.className = `card ${p.caught ? 'caught' : 'not-caught'}`; card.innerHTML = `<div class="card-top"><span class="number">#${String(p.id).padStart(3, '0')}</span><span class="status ${p.caught ? 'caught' : 'missing'}">${p.caught ? '● Capturado' : '○ Faltante'}</span></div><div class="card-visual"><img class="${artStyle === 'pixel' ? 'pixel-art' : ''}" src="${getPokemonImage(extra, artStyle, p.id)}" alt="${displayName}" loading="lazy"></div><div class="name">${displayName}</div>`; grid.appendChild(card); }); }
        function updateStats() { const total = pokemonData.length; const caught = pokemonData.filter(p => p.caught).length; const percentage = total ? Math.round(caught / total * 100) : 0; document.getElementById('progressStat').textContent = `${percentage}%`; document.getElementById('caughtStat').textContent = caught; document.getElementById('missingStat').textContent = total - caught; document.getElementById('progressBar').style.width = `${percentage}%`; }

        async function syncPokeApi() {
            if (!pokemonData.length) return;
            const button = document.getElementById('syncButton'); button.disabled = true; button.setAttribute('aria-label', 'Sincronizando dados da PokéAPI');
            const ids = pokemonData.map(p => p.id); let completed = 0;
            for (let index = 0; index < ids.length; index += 20) { await Promise.all(ids.slice(index, index + 20).map(async id => { try { const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`); if (response.ok) { const item = await response.json(); apiData[id] = { name: item.name, image: item.sprites.other?.['official-artwork']?.front_default || item.sprites.front_default, sprites: { official: item.sprites.other?.['official-artwork']?.front_default, home: item.sprites.other?.home?.front_default, dream: item.sprites.other?.dream_world?.front_default, pixel: item.sprites.front_default }, types: item.types.map(type => type.type.name) }; } } catch { /* mantém o item anterior em caso de falha */ } completed++; button.setAttribute('aria-label', `Sincronizando ${completed} de ${ids.length}`); })); }
            writeCache(API_CACHE_KEY, { savedAt: Date.now(), data: apiData }); renderGrid(pokemonData); setCacheNotice(Date.now(), 'PokéAPI sincronizada'); button.disabled = false; button.setAttribute('aria-label', 'Atualizar dados da PokéAPI');
        }
        document.getElementById('artStyle').value = artStyle;
        loadPokedex();
    </script>
</body>

</html>
